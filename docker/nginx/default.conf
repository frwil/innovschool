# Rate limiting - protection contre les attaques bruteforce
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php index.html;

    # ============================================
    # Optimisations noyau
    # ============================================
    sendfile on;
    sendfile_max_chunk 2m;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;

    # Cache des descripteurs de fichiers — réduit les appels open()
    open_file_cache max=5000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Logs (JSON en prod pour agrégation)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # En-têtes de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ ^/build/ {
        try_files $uri =404;
        expires max;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Assets statiques avec hash dans le nom (immutable)
    location ~* "\.([0-9a-f]{8,})\.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$" {
        try_files $uri =404;
        expires max;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Autres assets statiques
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|pdf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Static files
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Rate limiting pour le login
    location ~ ^/login {
        limit_req zone=login burst=3 nodelay;
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PHP handling
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_index index.php;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;

        # Buffer settings optimisés
        fastcgi_buffers 256 16k;
        fastcgi_buffer_size 64k;
        fastcgi_busy_buffers_size 128k;
        fastcgi_temp_file_write_size 256k;

        # Cache FastCGI pour les pages statiques
        fastcgi_cache off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files and directories
    location ~ /(composer\.json|composer\.lock|package\.json|\.env|\.env\..*|phpunit\.xml|symfony\.lock|README\.md|\.git) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive Symfony directories
    location ~ ^/(var|vendor|bin|config|migrations|templates|translations|tests)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to PHP files in uploads
    location ~* ^/uploads/.*\.php$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}