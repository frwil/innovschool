; ============================================
; Configuration performances PHP
; ============================================
memory_limit = 4096M
max_execution_time = 0
max_input_time = -1

; Realpath cache — évite les appels stat() répétés
; Crucial sur Docker/Windows où le FS est lent
realpath_cache_size = 8192K
realpath_cache_ttl = 600

; ============================================
; OPcache — cache d'opcode PHP
; ============================================
opcache.enable = 1
opcache.memory_consumption = 512
opcache.max_accelerated_files = 50000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.interned_strings_buffer = 32
opcache.enable_file_override = 1
opcache.max_wasted_percentage = 5
opcache.consistency_checks = 0
opcache.huge_code_pages = 0
opcache.file_cache = /tmp/opcache
opcache.file_cache_only = 0
opcache.file_cache_fallback = 1

; Important : en dev, passer validate_timestamps=1 et revalidate_freq=2
; pour que les changements de code soient détectés sans redémarrer.
